<rect x="1330" y="235" width="200" height="170" rx="8" class="blk"/><text x="1430" y="285" text-anchor="middle" class="h">CIC + FIR</text><text x="1430" y="325" text-anchor="middle" class="t">24-bit FIFO</text><text x="1430" y="360" text-anchor="middle" class="small">250 SPS</text>
