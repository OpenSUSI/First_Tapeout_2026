<text x="70" y="70" class="title">EEG専用アナログ・フロントエンド／ΣΔ ADC 構成</text>
<text x="70" y="108" class="sub">完全差動信号経路とCaravel RISC-V制御（test5設計入力）</text>
<text x="65" y="175" class="h">アナログ入力</text><text x="1360" y="175" class="h">デジタル出力</text>
