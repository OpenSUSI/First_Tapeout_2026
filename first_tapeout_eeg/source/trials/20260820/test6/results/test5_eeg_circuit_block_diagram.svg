<style>
.title{font:700 40px 'Yu Gothic','Meiryo',sans-serif;fill:#163e78}.sub{font:24px 'Yu Gothic','Meiryo',sans-serif;fill:#555}.h{font:700 22px 'Yu Gothic','Meiryo',sans-serif;fill:#163e78}.t{font:19px 'Yu Gothic','Meiryo',sans-serif;fill:#222}.io{font:700 18px 'Yu Gothic','Meiryo',sans-serif;fill:#143963}.small{font:16px 'Yu Gothic','Meiryo',sans-serif;fill:#555}.blk{fill:#eef4fa;stroke:#3769a5;stroke-width:3}.analog{stroke:#23898b;stroke-width:5;fill:none}.digital{stroke:#7b579b;stroke-width:4;fill:none}.power{stroke:#cf7831;stroke-width:3;fill:none}.dash{stroke:#8b8b8b;stroke-width:2;stroke-dasharray:9 7;fill:none}
