<rect x="70" y="765" width="1460" height="78" rx="4" fill="#f6f6f6" stroke="#bbb"/><text x="95" y="798" class="small">電源：VDDA 1.8 V（AFE/ADC）／VSSA、VCCD 1.8 V（デジタル）／VSSD　　外部・試験端子：EEG_INP/N、BIAS、VCM/REF、TEST_P/N</text><text x="95" y="828" class="small">注意：17.5 ENOB、0.0389 µVrms、40.07 dBはアーキテクチャ推定。Sky130 PVT・雑音・CMFB安定性・Monte Carloは未実行。</text>
